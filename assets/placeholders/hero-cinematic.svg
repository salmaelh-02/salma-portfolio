<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="warmLight" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#E8C7A5" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#9C6B52" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#2D151B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#140A0D"/>
    </radialGradient>
    <linearGradient id="filmGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A373" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E0E12" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#140A0D"/>
  <rect width="1920" height="1080" fill="url(#warmLight)"/>
  
  <!-- Architectural & Fashion Silhouette Geometry -->
  <g opacity="0.35">
    <path d="M400,0 L700,1080 L550,1080 L300,0 Z" fill="#F4EFE6" opacity="0.15"/>
    <circle cx="1250" cy="480" r="320" fill="#FCEAEB" opacity="0.12"/>
    <line x1="200" y1="900" x2="1720" y2="900" stroke="#FAF8F5" stroke-width="1" stroke-dasharray="8 8" opacity="0.3"/>
  </g>

  <!-- Editorial Film Frame Details -->
  <text x="120" y="160" fill="#FDFBF3" font-family="'Space Grotesk', monospace" font-size="22" letter-spacing="4" opacity="0.75">ROLL A-01 // 35MM CINEMA</text>
  <text x="120" y="960" fill="#D4C392" font-family="'Instrument Serif', serif" font-style="italic" font-size="42" opacity="0.85">“Sell the world around the product.”</text>
  <text x="1600" y="960" fill="#FAF8F5" font-family="'Space Grotesk', monospace" font-size="18" letter-spacing="3" opacity="0.6">CAIRO 2026</text>

  <!-- Developer Replace Notice -->
  <rect x="710" y="500" width="500" height="80" rx="4" fill="rgba(20, 18, 16, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
  <text x="960" y="546" fill="#FAF8F5" font-family="'Space Grotesk', monospace" font-size="16" letter-spacing="2" text-anchor="middle">
    [ PLACEHOLDER: HERO SHOWREEL VIDEO ]
  </text>
